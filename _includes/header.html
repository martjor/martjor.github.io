<header class="site-header">
  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}">
      {{ site.title | escape }}
    </a>

    <nav class="site-nav">
      {%- assign nav_pages = site.pages | where_exp: "item", "item.title" | sort: "nav_order" -%}
      {%- for my_page in nav_pages -%}
        <a class="page-link" href="{{ my_page.url | relative_url }}">{{ my_page.title | escape }}</a>
      {%- endfor -%}
    </nav>
  </div>
</header>
